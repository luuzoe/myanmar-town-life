const mats = {};
function M(c){ if(!mats[c]) mats[c] = new THREE.MeshLambertMaterial({color:c}); return mats[c]; }
function mesh(geo, color, x, y, z, parent){
  const m = new THREE.Mesh(geo, M(color));
  m.position.set(x, y, z); (parent || scene).add(m);
  m.castShadow = !isMobile; m.receiveShadow = !isMobile; return m;
}
function blobShadow(parent, rx, rz){
  if(!isMobile) return;
  const b = new THREE.Mesh(new THREE.CircleGeometry(1,16), new THREE.MeshBasicMaterial({color:0x000000, transparent:true, opacity:0.25, depthWrite:false}));
  b.rotation.x = -Math.PI/2; b.scale.set(rx, rz, 1); b.position.y = 0.02; parent.add(b);
}
function bx(w,h,d,color,x,y,z,parent){ return mesh(new THREE.BoxGeometry(w,h,d), color, x, y, z, parent); }
function sph(r,color,x,y,z,parent){ return mesh(new THREE.SphereGeometry(r,8,6), color, x, y, z, parent); }
function cyl(rt,rb,h,color,x,y,z,parent){ return mesh(new THREE.CylinderGeometry(rt,rb,h,8), color, x, y, z, parent); }
function cap(r,len,color,x,y,z,parent){
  const m = new THREE.Mesh(new THREE.CapsuleGeometry(r,len,4,8), M(color));
  m.position.set(x,y,z); (parent || scene).add(m);
  m.castShadow = !isMobile; m.receiveShadow = !isMobile; return m;
}
function signMesh(text, bg, fg, x, y, z, w, h, fs){
  const cv = document.createElement('canvas'); cv.width = 512; cv.height = 128;
  const ctx = cv.getContext('2d'); ctx.fillStyle = bg; ctx.fillRect(0,0,512,128);
  ctx.fillStyle = fg; ctx.font = 'bold ' + (fs || 68) + 'px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, 256, 64);
  const sign = new THREE.Mesh(new THREE.PlaneGeometry(w,h), new THREE.MeshLambertMaterial({map:new THREE.CanvasTexture(cv)}));
  sign.position.set(x,y,z); scene.add(sign); return sign;
}

const colliders = [];
function house(x,z,wall,roof){

  bx(1.3,2.6,0.15,0x6d4c41,x,1.8,z+6.05);

}

function shopBuilding(x,z,w,h,d,wall,roof,sign,signBg,signFg,fs){

const treeBlockers = [];

function animatePerson(p, moving, walkPhase, globalTime, riding){
  if(riding){
    p.thighL.rotation.x = -0.7; p.thighR.rotation.x = -0.7;
    p.shinL.rotation.x = 1.1; p.shinR.rotation.x = 1.1;
    p.upperL.rotation.x = -0.6; p.upperR.rotation.x = -0.6;
    p.foreL.rotation.x = -0.4; p.foreR.rotation.x = -0.4;
  } else if(moving){
    // slower, longer strides: old factor 3.9 gave ~13 steps/sec at walk speed
    // (player covers 10.5 units/s) - legs blurred. Factor 1.6 = ~2.7 cycles/s,
    // ~5.4 steps/s, stride ~1.9 units, matching a fast walk/run pace.
    const s = Math.sin(walkPhase*1.6)*0.65;
    p.thighL.rotation.x = s; p.thighR.rotation.x = -s;
    p.shinL.rotation.x = Math.max(0, -s)*1.1; p.shinR.rotation.x = Math.max(0, s)*1.1;
    p.upperL.rotation.x = -s*0.8; p.upperR.rotation.x = s*0.8;
    p.foreL.rotation.x = -0.4; p.foreR.rotation.x = -0.4;
    p.head.position.y = 2.18 + Math.abs(Math.sin(walkPhase*1.6))*0.03;
    p.head.rotation.y = 0;
  } else {
    p.thighL.rotation.x = 0; p.thighR.rotation.x = 0;
    p.shinL.rotation.x = 0; p.shinR.rotation.x = 0;
    p.upperL.rotation.x = 0; p.upperR.rotation.x = 0;
    p.foreL.rotation.x = 0; p.foreR.rotation.x = 0;
    p.head.rotation.y = Math.sin(globalTime*0.8)*0.15;
    p.head.position.y = 2.18 + Math.sin(globalTime*2)*0.01;
  }
  const blink = (globalTime % 3.7 < 0.12) ? 0.15 : 1;
  for(const e of p.eyes) e.scale.y = blink;
}

function turnTo(obj, target, dt, rate){
  let diff = target - obj.rotation.y;
  while(diff > Math.PI) diff -= Math.PI*2;
  while(diff < -Math.PI) diff += Math.PI*2;
  const step = Math.max(-rate*dt, Math.min(rate*dt, diff));
  obj.rotation.y += step;
}

function playThud(){

    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(90, audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.2);
    g.gain.setValueAtTime(0.4, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);

function distToSegment(px,pz,cx,cz,fx,fz,halfLen){
  const dx = px-cx, dz = pz-cz;
  let t = dx*fx + dz*fz; t = Math.max(-halfLen, Math.min(halfLen, t));
  const qx = cx + fx*t, qz = cz + fz*t;
  return {dist: Math.hypot(px-qx, pz-qz), qx, qz};
}
function carHitCheck(cx,cz,fx,fz,halfLen,threshold){
  if(carHitCooldown > 0) return;
  const r = distToSegment(player.g.position.x, player.g.position.z, cx, cz, fx, fz, halfLen);
  if(r.dist < threshold){
    const dx = player.g.position.x - r.qx, dz = player.g.position.z - r.qz, d = Math.hypot(dx,dz) || 1;
    player.g.position.x += dx/d*4; player.g.position.z += dz/d*4;
    player.g.position.x = Math.max(-122, Math.min(200, player.g.position.x));
    player.g.position.z = Math.max(-122, Math.min(122, player.g.position.z));

}

const minimapEl = document.getElementById('minimap'), minimapCtx = minimapEl ? minimapEl.getContext('2d') : null;
function drawMinimap(){
  if(!minimapCtx) return;
  const ctx = minimapCtx, S = 240/560, offY = (120 - 260*S)/2;
  const mx = x => (x+135)*S, my = z => (z+130)*S + offY;
  ctx.clearRect(0,0,240,120); ctx.fillStyle = '#6fbf5a'; ctx.fillRect(0,0,240,120);
  ctx.fillStyle = '#444444';
  for(const r of roadLines){ ctx.fillRect(mx(r)-1.5, my(-130), 3, 260*S); ctx.fillRect(mx(-130), my(r)-1.5, 560*S, 3); }
  ctx.fillStyle = '#2196f3'; ctx.fillRect(mx(169), my(-130), 12*S, 260*S);
  ctx.fillStyle = '#8d5a2b';
  for(const f of fieldCenters) ctx.fillRect(mx(f[0]-11), my(f[1]-14), 22*S, 28*S);
  ctx.fillStyle = '#607d8b';
  for(const m of mountainPeaks) ctx.fillRect(mx(m[0])-4, my(m[1])-4, 8, 8);
  ctx.fillStyle = '#ffffff';
  for(const h of houseList) ctx.fillRect(mx(h[0])-1.5, my(h[1])-1.5, 3, 3);
  ctx.fillStyle = '#ffeb3b'; ctx.fillRect(mx(-100)-3, my(60)-3, 6, 6);
  ctx.fillStyle = '#e53935'; ctx.fillRect(mx(100)-3, my(-20)-3, 6, 6);
  ctx.fillStyle = '#ef6c00'; ctx.fillRect(mx(95)-3, my(-72)-3, 6, 6);
  ctx.fillStyle = '#2e7d32'; ctx.fillRect(mx(12)-3, my(-32)-3, 6, 6);
  if(delivery){ ctx.fillStyle = '#ffeb3b'; ctx.fillRect(mx(delivery.x)-3, my(delivery.z)-3, 6, 6); }
  else { ctx.fillStyle = '#2e7d32'; ctx.fillRect(mx(12)-3, my(-32)-3, 6, 6); }
  ctx.fillStyle = '#ec407a';
  for(const p of [...npcs.map(n=>n.p), ...yardPeople.map(y=>y.p), ...schoolKids.map(k=>k.p), ...staticPeople]) ctx.fillRect(mx(p.g.position.x)-1.5, my(p.g.position.z)-1.5, 3, 3);
  const px = mx(player.g.position.x), py = my(player.g.position.z);
  ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(px, py, 4, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(px, py);
  ctx.lineTo(px + Math.sin(player.g.rotation.y)*10, py + Math.cos(player.g.rotation.y)*10); ctx.stroke();
}
function camBlocked(camX, camZ, px, pz){
  for(const c of [...colliders, ...treeBlockers]){
    if(c.cam === false) continue;
    if(c.r < 2 && !treeBlockers.includes(c)) continue;
    const dx = px - camX, dz = pz - camZ, len2 = dx*dx + dz*dz;
    if(len2 < 0.01) continue;
    let t = ((c.x - camX)*dx + (c.z - camZ)*dz) / len2;
    t = Math.max(0, Math.min(1, t));
    const qx = camX + dx*t, qz = camZ + dz*t;
    if(Math.hypot(c.x - qx, c.z - qz) < c.r + 0.3) return true;
  }
  return false;
}
function animate(now){
  requestAnimationFrame(animate);
  const dt = Math.min((now-last)/1000, 0.05); last = now;
  const gt = now/1000;
  if(cropTimer > 0){ cropTimer -= dt; if(cropTimer <= 0){ cropReady = true; crops.visible = true; } }
  if(marketTimer > 0) marketTimer -= dt;
  dayT += dt;
  const phase = (dayT % 180) / 180, angle = phase * Math.PI * 2, sunH = Math.sin(angle);
  const dayF = Math.max(0, Math.min(1, sunH + 0.25));
  skyColor.lerpColors(nightColor, dayColor, dayF);
  scene.fog.color.copy(skyColor);
  sun.intensity = 0.25 + dayF * 1.0;
  sun.position.set(Math.cos(angle)*60, 10 + dayF*50, 20);
  hemi.intensity = 0.3 + dayF * 0.8;
  moon.visible = dayF < 0.5;
  moon.position.set(player.g.position.x - Math.cos(angle)*120, 70, player.g.position.z - 60);
  const hour = Math.floor((6 + phase*24) % 24);
  const timeText = (phase < 0.5 ? (dayF > 0.7 ? '🌞' : '🌅') : '🌙') + ' ' + hour + ':00';
  if(timeText !== lastTimeText){ lastTimeText = timeText; timeEl.textContent = timeText; }
  let inRight = 0, inUp = 0;
  if(keys.KeyD || keys.ArrowRight) inRight += 1;
  if(keys.KeyA || keys.ArrowLeft) inRight -= 1;
  if(keys.KeyW || keys.ArrowUp) inUp += 1;
  if(keys.KeyS || keys.ArrowDown) inUp -= 1;
  inRight += joy.x; inUp += -joy.y;
  if(document.getElementById('shop').style.display==='flex' || document.getElementById('start').style.display!=='none'){ inRight = 0; inUp = 0; }
  const camFwd = {x: Math.sin(camYaw), z: Math.cos(camYaw)};
  const camRight = {x: -Math.cos(camYaw), z: Math.sin(camYaw)};
  let dx = camRight.x*inRight + camFwd.x*inUp;
  let dz = camRight.z*inRight + camFwd.z*inUp;
  const len = Math.hypot(dx,dz);
  const moving = len > 0.1;
  if(moving){
    dx/=Math.max(1,len); dz/=Math.max(1,len);
    const sp = riding ? (fastBike?26:18) : 10.5;
    player.g.position.x += dx*sp*dt; player.g.position.z += dz*sp*dt;
    turnTo(player.g, Math.atan2(dx,dz), dt, 10);
    player.g.position.x = Math.max(-122, Math.min(200, player.g.position.x));
    player.g.position.z = Math.max(-122, Math.min(122, player.g.position.z));
    for(const c of colliders){
      const ddx = player.g.position.x-c.x, ddz = player.g.position.z-c.z, d = Math.hypot(ddx,ddz);
      if(d < c.r+0.8 && d > 0.01){ player.g.position.x = c.x + ddx/d*(c.r+0.8); player.g.position.z = c.z + ddz/d*(c.r+0.8); }
    }
    player.g.position.y = (Math.abs(player.g.position.x-175) < 8 && Math.abs(player.g.position.z) < 4) ? 0.35 : 0;
    walkT += sp*dt;
  }
  animatePerson(player, moving, walkT, gt, riding);
  if(moving && !riding){
    const stepIdx = Math.floor(walkT / 1.9);
    if(stepIdx !== lastStep){ lastStep = stepIdx; playStep(); }
  }
  birdTimer -= dt;
  if(birdTimer <= 0){ if(dayF > 0.5) playBird(); birdTimer = 8 + Math.random()*10; }
  for(const n of npcs){
    const tx = n.target.x, tz = n.target.z;
    const px = n.p.g.position.x, pz = n.p.g.position.z;
    let mx = 0, mz = 0;
    if(Math.abs(tx-px) > 0.6) mx = Math.sign(tx-px);
    else if(Math.abs(tz-pz) > 0.6) mz = Math.sign(tz-pz);
    else { n.target = intersections[Math.floor(Math.random()*intersections.length)]; continue; }
    n.p.g.position.x += mx*n.speed*dt; n.p.g.position.z += mz*n.speed*dt;
    turnTo(n.p.g, Math.atan2(mx,mz), dt, 8);
    animatePerson(n.p, true, gt*n.speed + px, gt, false);
  }
  for(const y of yardPeople){
    y.angle += dt*0.35*y.dir;
    const px = y.house.x + Math.cos(y.angle)*y.radius, pz = y.house.z + Math.sin(y.angle)*y.radius;
    const dx2 = -Math.sin(y.angle)*y.dir, dz2 = Math.cos(y.angle)*y.dir;
    y.p.g.position.set(px, 0, pz);
    turnTo(y.p.g, Math.atan2(dx2,dz2), dt, 8);
    animatePerson(y.p, true, gt*3.15 + px, gt, false);
  }
  for(const k of schoolKids){
    const dx2 = k.target.x - k.p.g.position.x, dz2 = k.target.z - k.p.g.position.z, d2 = Math.hypot(dx2,dz2);
    if(d2 < 1){ k.target = {x:-108+Math.random()*16, z:68+Math.random()*3}; }
    else {
      k.p.g.position.x += dx2/d2*3.5*dt; k.p.g.position.z += dz2/d2*3.5*dt;
      turnTo(k.p.g, Math.atan2(dx2,dz2), dt, 8);
      animatePerson(k.p, true, gt*3.5, gt, false);
    }
  }
  for(const p of staticPeople) animatePerson(p, false, 0, gt, false);
  for(const a of animals){
    const dx2 = a.target.x - a.g.position.x, dz2 = a.target.z - a.g.position.z, d2 = Math.hypot(dx2,dz2);
    if(d2 < 1){ a.target = pickAnimalTarget(a.area); }
    else {
      a.g.position.x += dx2/d2*a.speed*dt; a.g.position.z += dz2/d2*a.speed*dt;
      turnTo(a.g, Math.atan2(dx2,dz2), dt, 8);
      a.g.position.y = Math.abs(Math.sin(gt*6))*0.05;
    }
    // animals no longer walk through houses, pond, trees, fences or stream
    for(const c of colliders){
      const adx = a.g.position.x-c.x, adz = a.g.position.z-c.z, ad = Math.hypot(adx,adz);
      if(ad < c.r+0.5 && ad > 0.01){ a.g.position.x = c.x + adx/ad*(c.r+0.5); a.g.position.z = c.z + adz/ad*(c.r+0.5); }
    }
  }
  if(carHitCooldown > 0) carHitCooldown -= dt;
  for(const car of cars){
    const tx = car.target.x, tz = car.target.z;
    const px = car.g.position.x, pz = car.g.position.z;
    let mx = 0, mz = 0;
    if(Math.abs(tx-px) > 0.8) mx = Math.sign(tx-px);
    else if(Math.abs(tz-pz) > 0.8) mz = Math.sign(tz-pz);
    else { car.target = intersections[Math.floor(Math.random()*intersections.length)]; continue; }
    car.g.position.x += mx*car.speed*dt; car.g.position.z += mz*car.speed*dt;
    turnTo(car.g, Math.atan2(mx,mz), dt, 6);
    const fx = Math.sin(car.g.rotation.y), fz = Math.cos(car.g.rotation.y);
    carHitCheck(car.g.position.x, car.g.position.z, fx, fz, 2.75, 1.8);
  }
  {
    const bt = busRoute[busIdx];
    const dx2 = bt.x - bus.position.x, dz2 = bt.z - bus.position.z, d2 = Math.hypot(dx2,dz2);
    if(d2 < 1.5){ busIdx = (busIdx+1) % busRoute.length; }
    else {
      let mx = 0, mz = 0;
      if(Math.abs(dx2) > 1.5) mx = Math.sign(dx2); else mz = Math.sign(dz2);
      bus.position.x += mx*10*dt; bus.position.z += mz*10*dt;
      turnTo(bus, Math.atan2(mx,mz), dt, 5);
      const fx = Math.sin(bus.rotation.y), fz = Math.cos(bus.rotation.y);
      carHitCheck(bus.position.x, bus.position.z, fx, fz, 6, 2.0);
    }
  }
  for(const f of foam){ f.position.z += dt*4; if(f.position.z > 130) f.position.z = -130; }
  for(const c of clouds){ c.position.x += dt*1.2; if(c.position.x > 140) c.position.x = -140; }
  const n = nearest();
  const actLabelEl = document.getElementById('actLabel');
  actLabelEl.textContent = n ? n.label : '';
  actLabelEl.style.display = n ? 'block' : 'none';
  actBtn.textContent = 'လုပ်';
  actBtn.disabled = !n;
  beacon.rotation.y += dt*2;
  if(delivery) beacon.position.y = Math.sin(now/300)*0.6;
  shopBeacon.rotation.y += dt*2;
  if(!delivery) shopBeacon.position.y = Math.sin(now/300)*0.6;
  if(++mapFrame % 3 === 0) drawMinimap();
  // smooth rot-button turn: camYaw glides to target, never snaps 45 degrees at once
  {
    let cdiff = targetCamYaw - camYaw;
    while(cdiff > Math.PI) cdiff -= Math.PI*2;
    while(cdiff < -Math.PI) cdiff += Math.PI*2;
    const cstep = Math.max(-4*dt, Math.min(4*dt, cdiff));
    camYaw += cstep;
  }
  const cf = {x: Math.sin(camYaw), z: Math.cos(camYaw)};
  // camera occlusion: pull camera in / raise it until no big building blocks the view
  let targetDist = 16, targetH = 6.5;
  for(let a=0; a<12; a++){
    const cx = player.g.position.x - cf.x*targetDist, cz = player.g.position.z - cf.z*targetDist;
    if(!camBlocked(cx, cz, player.g.position.x, player.g.position.z)) break;
    targetDist = Math.max(3, targetDist - 1.5);
    targetH = Math.min(12, targetH + 0.8);
    if(targetDist <= 3) break;
  }
  smoothCamDist += (targetDist - smoothCamDist) * Math.min(1, dt*8);
  smoothCamH += (targetH - smoothCamH) * Math.min(1, dt*8);
  // pitch: camera height follows pitch (drag up/down), default 15deg = smoothCamH
  const pitchH = smoothCamH + (Math.tan(camPitch) - Math.tan(Math.atan(4.3/16)))*smoothCamDist;
  camera.position.set(player.g.position.x - cf.x*smoothCamDist, pitchH, player.g.position.z - cf.z*smoothCamDist);
  camera.lookAt(player.g.position.x, player.g.position.y + 2.2, player.g.position.z);
  renderer.render(scene,camera);
}
requestAnimationFrame(animate);
addEventListener('resize', ()=>{ camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
</script>
