<!DOCTYPE html>
<html lang="my"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>မိုင်းလား အစစ် — Real Mong La</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#87ceeb;font-family:system-ui,sans-serif}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:fixed;top:8px;left:8px;right:8px;display:flex;gap:6px;flex-wrap:wrap;z-index:10;pointer-events:none}
.pill{background:rgba(0,0,0,.65);color:#fff;padding:6px 10px;border-radius:16px;font-size:13px}
.pill b{color:#ffd54a}
#start{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:20;display:flex;align-items:center;justify-content:center}
#card{background:#fff;border-radius:16px;padding:22px;max-width:320px;text-align:center}
#card h1{margin:0 0 6px;font-size:22px}
#card p{color:#555;font-size:14px;line-height:1.6}
#playBtn{font-size:20px;padding:12px 26px;border:none;border-radius:12px;background:#2e7d32;color:#fff}
#joy{position:fixed;left:16px;bottom:16px;width:120px;height:120px;border-radius:50%;background:rgba(0,0,0,.35);z-index:10}
#knob{position:absolute;left:34px;top:34px;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.85)}
#modes{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:10}
#modes button{width:64px;height:48px;border-radius:12px;border:none;background:rgba(0,0,0,.6);color:#fff;font-size:15px}
#modes button.on{background:#2e7d32}
#flyBtns{position:fixed;right:92px;bottom:16px;display:none;flex-direction:column;gap:8px;z-index:10}
#flyBtns button{width:52px;height:52px;border-radius:50%;border:none;background:rgba(0,0,0,.6);color:#fff;font-size:20px}
#msg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.8);color:#fff;padding:10px 16px;border-radius:12px;font-size:15px;z-index:15;display:none}
#loading{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.7);color:#fff;padding:12px 18px;border-radius:12px;font-size:15px;z-index:15;display:none}
</style>
<script type="importmap">{"imports":{"three":"./js/three.module.js","three/addons/":"./js/addons/"}}</script>
</head><body>

<div class="pill">📍 <span id="streetPill">မိုင်းလား အစစ်</span></div>
<div class="pill">🚶 <span id="modePill">လမ်းလျှောက်</span></div>
<div class="pill" id="speedPill" style="display:none">💨 <span id="speedTxt">0</span> km/h</div>
</div>
<div id="start"><div id="card">
<h1>🏙️ မိုင်းလား အစစ်</h1>
<div style="font-size:12px;opacity:.6">V1.2</div>
<p>OpenStreetMap လမ်းအစစ်ပေါ် လမ်းလျှောက်၊ ကားမောင်း၊ ပျံသန်း။<br>လမ်းနာမည်အစစ်တွေ၊ နေရာအစစ်တွေ ပါပါတယ်။<br>အဆောက်အဦး/သစ်ပင် model တွေက နောက်မှ ထပ်ထည့်မယ်။</p>
<button id="playBtn">▶ ဆော့မယ်</button>
</div></div>
<div id="joy"><div id="knob"></div></div>
<script>document.getElementById('playBtn').addEventListener('click', function(){ document.getElementById('start').style.display = 'none'; document.getElementById('loading').style.display = 'block'; });</script>

<button id="btnWalk" class="on">🚶 လမ်း</button>
<button id="btnCar">🚗 ကား</button>
<button id="btnFly">🦅 ပျံ</button>

scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 400, 2500);
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 4000);
scene.add(new THREE.HemisphereLight(0xcfe8ff, 0x8a9a6a, 1.1));
const sun = new THREE.DirectionalLight(0xfff2cc, 1.4);
sun.position.set(300, 500, 200);
scene.add(sun);
const texLoader = new THREE.TextureLoader();
function showMsg(t){ const m = document.getElementById('msg'); m.textContent = t; m.style.display = 'block'; setTimeout(()=>{ m.style.display = 'none'; }, 2500); }
const grassMat = new THREE.MeshLambertMaterial({color:0x6fae5a});
texLoader.load('Textures/grass004.jpg', (t)=>{ t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(40, 36); grassMat.map = t; grassMat.color.set(0xffffff); grassMat.needsUpdate = true; });
const ground = new THREE.Mesh(new THREE.PlaneGeometry(1900, 1700), grassMat);
ground.rotation.x = -Math.PI/2;
ground.position.set(0, 0, 97.5);
scene.add(ground);
function flatShape(pts, color, y){
  const sh = new THREE.Shape();
  pts.forEach((p, i)=>{ if(i === 0) sh.moveTo(p[0], -p[1]); else sh.lineTo(p[0], -p[1]); });
  const g = new THREE.ShapeGeometry(sh);
  g.rotateX(-Math.PI/2);
  const m = new THREE.Mesh(g, new THREE.MeshLambertMaterial({color}));
  m.position.y = y;
  scene.add(m);
}
const LU = {residential:0x9dbb7d, park:0x7fbf6a, pitch:0x5da85a, sports_centre:0x8fbf7a, forest:0x4e8f4e, meadow:0x9ccb7d, grass:0x8fbf6a, industrial:0xb0bec5, commercial:0xc2b49a, kindergarten:0xaed581, townhall:0xc2b49a};
for(const l of DATA.landuse) flatShape(l.pts, LU[l.kind] || 0xd0d0d0, 0.05);
const RW = {trunk:11, primary:9, secondary:8, tertiary:7, residential:5, unclassified:5, living_street:4, service:3.5, footway:2, path:2, steps:2, track:3, construction:5};
const roadPos = [], roadUv = [], roadIdx = [];
const dashPos = [], dashIdx = [];
function ribbon(arr, iarr, p1, p2, w, y){
  const dx = p2[0]-p1[0], dz = p2[1]-p1[1], len = Math.hypot(dx, dz);
  if(len < 0.5) return 0;
  const px = -dz/len*w/2, pz = dx/len*w/2, b = arr.length/3;
  arr.push(p1[0]-px, y, p1[1]-pz, p1[0]+px, y, p1[1]+pz, p2[0]+px, y, p2[1]+pz, p2[0]-px, y, p2[1]-pz);
  iarr.push(b, b+1, b+2, b, b+2, b+3);
  return len;
}
const namedSegs = [];
for(const r of DATA.roads){
  const w = RW[r.type] || 4;
  let dist = 0;
  for(let i = 0; i + 1 < r.pts.length; i++){
    const a = r.pts[i], b = r.pts[i+1];
    const L = ribbon(roadPos, roadIdx, a, b, w, 0.15);
    const u0 = dist/12, u1 = (dist+L)/12;
    roadUv.push(u0, 0, u0, 1, u1, 1, u1, 0);
    dist += L;
    if(r.name) namedSegs.push([a[0], a[1], b[0], b[1], r.name]);
    if(['trunk','primary','secondary','tertiary'].includes(r.type)){
      const dashCol = 0;
      for(let d = 0; d + 3 < L; d += 7){
        const t0 = d/L, t1 = (d+3)/L;
        ribbon(dashPos, dashIdx, [a[0]+(b[0]-a[0])*t0, a[1]+(b[1]-a[1])*t0], [a[0]+(b[0]-a[0])*t1, a[1]+(b[1]-a[1])*t1], 0.5, 0.19);
      }
    }
  }
}
const roadGeo = new THREE.BufferGeometry();
roadGeo.setAttribute('position', new THREE.Float32BufferAttribute(roadPos, 3));
roadGeo.setAttribute('uv', new THREE.Float32BufferAttribute(roadUv, 2));
roadGeo.setIndex(roadIdx);
roadGeo.computeVertexNormals();
const roadMat = new THREE.MeshLambertMaterial({color:0xffffff});
texLoader.load('Textures/asphalt033.jpg', (t)=>{ t.wrapS = t.wrapT = THREE.RepeatWrapping; roadMat.map = t; roadMat.needsUpdate = true; });
scene.add(new THREE.Mesh(roadGeo, roadMat));
const dashGeo = new THREE.BufferGeometry();
dashGeo.setAttribute('position', new THREE.Float32BufferAttribute(dashPos, 3));
dashGeo.setIndex(dashIdx);
dashGeo.computeVertexNormals();
scene.add(new THREE.Mesh(dashGeo, new THREE.MeshBasicMaterial({color:0xffeb3b})));
for(const wtr of DATA.waters){
  if(wtr.kind !== 'line') continue;
  const wp = [], wi = [];
  for(let i = 0; i + 1 < wtr.pts.length; i++) ribbon(wp, wi, wtr.pts[i], wtr.pts[i+1], 7, 0.12);
  const wg = new THREE.BufferGeometry();
  wg.setAttribute('position', new THREE.Float32BufferAttribute(wp, 3));
  wg.setIndex(wi);
  wg.computeVertexNormals();
  scene.add(new THREE.Mesh(wg, new THREE.MeshLambertMaterial({color:0x4fc3f7})));
}
const beaconMat = new THREE.MeshBasicMaterial({color:0xffd54a, transparent:true, opacity:0.55});
for(const c of DATA.checkpoints){
  const beam = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 14, 8), beaconMat);
  beam.position.set(c.x, 7, c.z);
  scene.add(beam);
  const dot = new THREE.Mesh(new THREE.SphereGeometry(1.2, 10, 8), new THREE.MeshBasicMaterial({color:0xffd54a}));
  dot.position.set(c.x, 14, c.z);
  scene.add(dot);
}
let lampScene = null;
new GLTFLoader().load('prop-lamp.glb', (gltf)=>{
  lampScene = gltf.scene;
  for(const l of DATA.lamps){
    const c = gltf.scene.clone(true);
    c.traverse((o)=>{ if(o.isMesh){ o.castShadow = false; } });
    c.position.set(l.x, 0.12, l.z);
    scene.add(c);
  }
}, undefined, ()=>{});
const player = new THREE.Group();
player.position.set(0, 0.15, 0);
scene.add(player);
let mixer = null, walkClip = null;
new GLTFLoader().load('character.glb', (gltf)=>{
  const body = gltf.scene.children[0];
  body.scale.setScalar(2.40);
  body.rotation.y = -Math.PI/2;
  body.position.y = 0.05;
  player.add(gltf.scene);
  if(gltf.animations && gltf.animations.length){
    mixer = new THREE.AnimationMixer(gltf.scene);
    walkClip = mixer.clipAction(gltf.animations[0]);
    walkClip.play();
    mixer.setTime(0.667);
    mixer.update(0);
  }
}, undefined, ()=>{});
const carGroup = new THREE.Group();
carGroup.visible = false;
scene.add(carGroup);
let carLoaded = false;
new GLTFLoader().load('car-sedan.glb', (gltf)=>{
  const c = gltf.scene;
  c.traverse((o)=>{ if(o.isMesh){ o.castShadow = false; } });
  const bb = new THREE.Box3().setFromObject(c);
  const len = bb.max.z - bb.min.z;
  const s = 4.2/len;
  c.scale.setScalar(s);
  carGroup.add(c);
  carGroup.position.set(10, 0.15, 8);
  carLoaded = true;
}, undefined, ()=>{});
let mode = 'walk';
let camYaw = Math.PI, yawOff = 0;
let heading = 0, carSpeed = 0, flyH = 30, flyTarget = 30;
const joy = {x:0, y:0, on:false};
const keys = {};
const joyEl = document.getElementById('joy'), knob = document.getElementById('knob');
function joyMove(e){
  const t = e.touches ? e.touches[0] : e;
  const r = joyEl.getBoundingClientRect();
  let dx = (t.clientX - (r.left + r.width/2))/45, dy = (t.clientY - (r.top + r.height/2))/45;
  const l = Math.hypot(dx, dy);
  if(l > 1){ dx /= l; dy /= l; }
  joy.x = dx; joy.y = dy;
  knob.style.left = (34 + dx*30) + 'px';
  knob.style.top = (34 + dy*30) + 'px';
}
function joyEnd(){ joy.x = 0; joy.y = 0; joy.on = false; knob.style.left = '34px'; knob.style.top = '34px'; }
joyEl.addEventListener('touchstart', (e)=>{ joy.on = true; joyMove(e); e.preventDefault(); }, {passive:false});
joyEl.addEventListener('touchmove', (e)=>{ if(joy.on) joyMove(e); e.preventDefault(); }, {passive:false});
joyEl.addEventListener('touchend', joyEnd);
joyEl.addEventListener('mousedown', (e)=>{ joy.on = true; joyMove(e); });
addEventListener('mousemove', (e)=>{ if(joy.on) joyMove(e); });
addEventListener('mouseup', joyEnd);
addEventListener('keydown', (e)=>{ keys[e.key.toLowerCase()] = true; });
addEventListener('keyup', (e)=>{ keys[e.key.toLowerCase()] = false; });
let dragX = null;
canvas.addEventListener('pointerdown', (e)=>{ dragX = e.clientX; });
canvas.addEventListener('pointermove', (e)=>{ if(dragX !== null){ yawOff += (e.clientX - dragX)*0.005; dragX = e.clientX; } });
canvas.addEventListener('pointerup', ()=>{ dragX = null; });
function setMode(m){
  mode = m;
  document.getElementById('btnWalk').classList.toggle('on', m === 'walk');
  document.getElementById('btnCar').classList.toggle('on', m === 'car');
  document.getElementById('btnFly').classList.toggle('on', m === 'fly');
  document.getElementById('flyBtns').style.display = m === 'fly' ? 'flex' : 'none';
  document.getElementById('speedPill').style.display = m === 'car' ? 'block' : 'none';
  document.getElementById('modePill').textContent = m === 'walk' ? 'လမ်းလျှောက်' : m === 'car' ? 'ကားမောင်း' : 'ပျံသန်း';
  if(m === 'car' && carLoaded){
    player.visible = false;
    carGroup.visible = true;
    carGroup.position.set(player.position.x, 0.15, player.position.z);
    carGroup.rotation.y = heading;
  } else {
    player.visible = true;
    carGroup.visible = false;
    if(m === 'walk') player.position.y = 0.15;
  }
  if(m === 'fly') flyTarget = Math.max(20, player.position.y + 20);
}
document.getElementById('btnWalk').onclick = ()=>setMode('walk');
document.getElementById('btnCar').onclick = ()=>{ if(!carLoaded){ showMsg('ကားတင်နေတယ် ခဏစောင့်'); return; } setMode('car'); };
document.getElementById('btnFly').onclick = ()=>setMode('fly');
let flyUp = false, flyDown = false;
document.getElementById('btnUp').addEventListener('touchstart', (e)=>{ flyUp = true; e.preventDefault(); }, {passive:false});
document.getElementById('btnUp').addEventListener('touchend', ()=>{ flyUp = false; });
document.getElementById('btnDown').addEventListener('touchstart', (e)=>{ flyDown = true; e.preventDefault(); }, {passive:false});
document.getElementById('btnDown').addEventListener('touchend', ()=>{ flyDown = false; });
document.getElementById('playBtn').onclick = ()=>{
  document.getElementById('start').style.display = 'none';
  showMsg('ဝမ်လုံလမ်းဆုံကနေ စတယ် — လမ်းနာမည်တွေ အပေါ်မှာ မြင်ရမယ်');
};
function inputVec(){
  let x = joy.x, y = joy.y;
  if(keys['a'] || keys['arrowleft']) x -= 1;
  if(keys['d'] || keys['arrowright']) x += 1;
  if(keys['w'] || keys['arrowup']) y -= 1;
  if(keys['s'] || keys['arrowdown']) y += 1;
  const l = Math.hypot(x, y);
  if(l > 1){ x /= l; y /= l; }
  return {x, y};
}
function turnTo(obj, target, rate, dt){
  let d = target - obj.rotation.y;
  while(d > Math.PI) d -= Math.PI*2;
  while(d < -Math.PI) d += Math.PI*2;
  obj.rotation.y += d * Math.min(1, rate*dt);
}
let streetTimer = 0;
function nearestStreet(x, z){
  let best = 1e9, name = '';
  for(const s of namedSegs){
    const dx = s[2]-s[0], dz = s[3]-s[1], L2 = dx*dx + dz*dz;
    let t = L2 ? ((x-s[0])*dx + (z-s[1])*dz)/L2 : 0;
    t = Math.max(0, Math.min(1, t));
    const px = s[0]+dx*t, pz = s[1]+dz*t, dd = Math.hypot(x-px, z-pz);
    if(dd < best){ best = dd; name = s[4]; }
  }
  return best < 20 ? name : '';
}
function nearestCheckpoint(x, z){
  let best = 1e9, name = '';
  for(const c of DATA.checkpoints){
    const dd = Math.hypot(x-c.x, z-c.z);
    if(dd < best){ best = dd; name = c.name; }
  }
  return best < 18 ? name : '';
}
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  if(!window.__rf){ window.__rf = true; const ld = document.getElementById('loading'); if(ld) ld.style.display = 'none'; }
  const dt = Math.min(clock.getDelta(), 0.05);
  const inp = inputVec();
  const moving = Math.hypot(inp.x, inp.y) > 0.1;
  const yaw = camYaw + yawOff;
  const fx = Math.sin(yaw), fz = Math.cos(yaw);
  const rx = Math.cos(yaw), rz = -Math.sin(yaw);
  if(mode === 'walk'){
    if(moving){
      const mx = -fx*(-inp.y) + rx*inp.x, mz = -fz*(-inp.y) + rz*inp.x;
      const ml = Math.hypot(mx, mz);
      player.position.x += mx/ml*10.5*dt;
      player.position.z += mz/ml*10.5*dt;
      turnTo(player, Math.atan2(mx, mz), 10, dt);
    }
    if(mixer){
      if(moving) mixer.update(dt*3.0);
      else { mixer.setTime(0.667); mixer.update(0); }
    }
    const d = 7, h = 3.5;
    camera.position.set(player.position.x + fx*d, player.position.y + h, player.position.z + fz*d);
    camera.lookAt(player.position.x, player.position.y + 1.5, player.position.z);
  } else if(mode === 'car'){
    if(inp.y < -0.1) carSpeed += 14*dt;
    else if(inp.y > 0.1) carSpeed -= 20*dt;
    else carSpeed *= Math.max(0, 1 - 0.8*dt);
    carSpeed = Math.max(-8, Math.min(26, carSpeed));
    heading += inp.x * 1.7 * Math.sign(carSpeed) * Math.min(1, Math.abs(carSpeed)/10) * dt;
    carGroup.rotation.y = heading;
    carGroup.position.x += Math.sin(heading)*carSpeed*dt;
    carGroup.position.z += Math.cos(heading)*carSpeed*dt;
    player.position.set(carGroup.position.x, 0.15, carGroup.position.z);
    document.getElementById('speedTxt').textContent = Math.round(Math.abs(carSpeed)*3.6);
    const d = 14 + Math.abs(carSpeed)*0.3, h = 6.5;
    camera.position.set(carGroup.position.x - Math.sin(heading)*d, 0.15 + h, carGroup.position.z - Math.cos(heading)*d);
    camera.lookAt(carGroup.position.x, 1.5, carGroup.position.z);
  } else {
    if(flyUp) flyTarget = Math.min(80, flyTarget + 25*dt);
    if(flyDown) flyTarget = Math.max(10, flyTarget - 25*dt);
    flyH += (flyTarget - flyH) * Math.min(1, dt*2);
    player.position.y = flyH;
    if(moving){
      const mx = -fx*(-inp.y) + rx*inp.x, mz = -fz*(-inp.y) + rz*inp.x;
      const ml = Math.hypot(mx, mz);
      player.position.x += mx/ml*20*dt;
      player.position.z += mz/ml*20*dt;
      turnTo(player, Math.atan2(mx, mz), 10, dt);
    }
    const d = 22;
    camera.position.set(player.position.x + fx*d, flyH + 10, player.position.z + fz*d);
    camera.lookAt(player.position.x, flyH, player.position.z);
  }
  streetTimer += dt;
  if(streetTimer > 0.5){
    streetTimer = 0;
    const px = player.position.x, pz = player.position.z;
    const st = nearestStreet(px, pz);
    const cp = nearestCheckpoint(px, pz);
    document.getElementById('streetPill').textContent = cp ? ('📍 ' + cp) : st ? ('🛣️ ' + st) : 'မိုင်းလား အစစ်';
  }
  renderer.render(scene, camera);
}
addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
animate();
</script>
